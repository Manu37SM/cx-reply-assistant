<svg width="1460" height="960" viewBox="0 0 1460 960" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1460" height="960" fill="#ffffff"/>
  <text x="30" y="36" font-size="20" font-weight="600" fill="#172420">Datastraw CX platform — architecture at 500-brand scale</text>

  <!-- ============ Channels row ============ -->
  <rect x="400" y="64" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <text x="510" y="86" font-size="14" font-weight="600" text-anchor="middle" fill="#0C447C">WhatsApp (Meta API)</text>
  <text x="510" y="104" font-size="11" text-anchor="middle" fill="#185FA5">customer channel</text>

  <rect x="640" y="64" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <text x="730" y="86" font-size="14" font-weight="600" text-anchor="middle" fill="#0C447C">Email</text>
  <text x="730" y="104" font-size="11" text-anchor="middle" fill="#185FA5">customer channel</text>

  <rect x="840" y="64" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <text x="940" y="86" font-size="14" font-weight="600" text-anchor="middle" fill="#0C447C">Web chat / other</text>
  <text x="940" y="104" font-size="11" text-anchor="middle" fill="#185FA5">customer channel</text>

  <!-- ============ Frontend (left column) ============ -->
  <rect x="40" y="64" width="270" height="290" rx="10" fill="#FBEAF0" stroke="#D4537E" stroke-width="1"/>
  <text x="175" y="90" font-size="14" font-weight="600" text-anchor="middle" fill="#72243E">Frontend</text>
  <rect x="60" y="106" width="230" height="60" rx="6" fill="#FFFFFF" stroke="#D4537E" stroke-width="0.75"/>
  <text x="175" y="130" font-size="12.5" font-weight="600" text-anchor="middle" fill="#72243E">Agent console (React)</text>
  <text x="175" y="147" font-size="11" text-anchor="middle" fill="#993556">per-brand conversation view</text>
  <rect x="60" y="178" width="230" height="60" rx="6" fill="#FFFFFF" stroke="#D4537E" stroke-width="0.75"/>
  <text x="175" y="202" font-size="12.5" font-weight="600" text-anchor="middle" fill="#72243E">Brand admin console</text>
  <text x="175" y="219" font-size="11" text-anchor="middle" fill="#993556">KB editing, agent mgmt</text>
  <rect x="60" y="250" width="230" height="60" rx="6" fill="#FFFFFF" stroke="#D4537E" stroke-width="0.75"/>
  <text x="175" y="274" font-size="12.5" font-weight="600" text-anchor="middle" fill="#72243E">CDN / static hosting</text>
  <text x="175" y="291" font-size="11" text-anchor="middle" fill="#993556">Vercel / CloudFront edge</text>

  <line x1="310" y1="209" x2="385" y2="204" stroke="#5f5e5a" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="316" y="228" font-size="10.5" fill="#5f5e5a">brand-scoped JWT</text>

  <!-- Arrows: channels -> gateway -->
  <line x1="510" y1="120" x2="510" y2="160" stroke="#5f5e5a" stroke-width="1.25" marker-end="url(#arrow)"/>
  <line x1="730" y1="120" x2="730" y2="160" stroke="#5f5e5a" stroke-width="1.25" marker-end="url(#arrow)"/>
  <line x1="940" y1="120" x2="940" y2="160" stroke="#5f5e5a" stroke-width="1.25" marker-end="url(#arrow)"/>

  <!-- ============ API Gateway / Ingestion ============ -->
  <rect x="385" y="164" width="700" height="80" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="735" y="192" font-size="14.5" font-weight="600" text-anchor="middle" fill="#2C2C2A">API gateway / webhook ingestion</text>
  <text x="735" y="212" font-size="11.5" text-anchor="middle" fill="#444441">Auth: Supabase Auth JWT (brand_id + role claims) · idempotency check on webhook event ID</text>
  <text x="735" y="230" font-size="11.5" text-anchor="middle" fill="#444441">Edge Functions / RPCs · rate limiting per brand</text>

  <line x1="735" y1="244" x2="735" y2="280" stroke="#5f5e5a" stroke-width="1.25" marker-end="url(#arrow)"/>

  <!-- ============ Message Queue ============ -->
  <rect x="485" y="284" width="500" height="64" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="735" y="310" font-size="14" font-weight="600" text-anchor="middle" fill="#633806">Message queue / event bus</text>
  <text x="735" y="328" font-size="11" text-anchor="middle" fill="#854F0B">partitioned per brand · at-least-once · retry + dead-letter queue</text>

  <line x1="620" y1="348" x2="500" y2="392" stroke="#5f5e5a" stroke-width="1.25" marker-end="url(#arrow)"/>
  <line x1="735" y1="348" x2="735" y2="392" stroke="#5f5e5a" stroke-width="1.25" marker-end="url(#arrow)"/>
  <line x1="850" y1="348" x2="985" y2="392" stroke="#5f5e5a" stroke-width="1.25" marker-end="url(#arrow)"/>

  <!-- ============ Core services row ============ -->
  <rect x="385" y="396" width="240" height="76" rx="9" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="505" y="422" font-size="13.5" font-weight="600" text-anchor="middle" fill="#3C3489">Conversation &amp; CRM service</text>
  <text x="505" y="440" font-size="11" text-anchor="middle" fill="#534AB7">customer, order, thread state</text>
  <text x="505" y="457" font-size="11" text-anchor="middle" fill="#534AB7">brand-scoped by RLS policy</text>

  <rect x="635" y="396" width="220" height="76" rx="9" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="745" y="422" font-size="13.5" font-weight="600" text-anchor="middle" fill="#3C3489">Knowledge retrieval</text>
  <text x="745" y="440" font-size="11" text-anchor="middle" fill="#534AB7">topic classify + vector search</text>
  <text x="745" y="457" font-size="11" text-anchor="middle" fill="#534AB7">brand-namespaced collections</text>

  <rect x="885" y="396" width="220" height="76" rx="9" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="995" y="422" font-size="13.5" font-weight="600" text-anchor="middle" fill="#3C3489">AI orchestration</text>
  <text x="995" y="440" font-size="11" text-anchor="middle" fill="#534AB7">grounding, prompt build, log</text>
  <text x="995" y="457" font-size="11" text-anchor="middle" fill="#534AB7">confidence scoring</text>

  <!-- services -> data / ai -->
  <line x1="505" y1="472" x2="505" y2="700" stroke="#5f5e5a" stroke-width="1.25" marker-end="url(#arrow)"/>
  <line x1="745" y1="472" x2="745" y2="590" stroke="#5f5e5a" stroke-width="1.25" marker-end="url(#arrow)"/>
  <line x1="995" y1="472" x2="995" y2="500" stroke="#5f5e5a" stroke-width="1.25" marker-end="url(#arrow)"/>

  <!-- ============ AI layer (stacked, right of knowledge/qdrant column) ============ -->
  <rect x="875" y="500" width="240" height="252" rx="10" fill="none" stroke="#D85A30" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="995" y="520" font-size="12.5" font-weight="600" text-anchor="middle" fill="#712B13">AI layer</text>

  <rect x="895" y="530" width="200" height="58" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="995" y="552" font-size="12.5" font-weight="600" text-anchor="middle" fill="#712B13">Guardrail / prompt</text>
  <text x="995" y="568" font-size="10.5" text-anchor="middle" fill="#993C1D">grounding notes, policy checks</text>

  <line x1="995" y1="588" x2="995" y2="600" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="895" y="600" width="200" height="58" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="995" y="622" font-size="12.5" font-weight="600" text-anchor="middle" fill="#712B13">LLM gateway</text>
  <text x="995" y="638" font-size="10.5" text-anchor="middle" fill="#993C1D">OpenRouter · DeepInfra fallback</text>

  <line x1="995" y1="658" x2="995" y2="670" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="895" y="670" width="200" height="58" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="995" y="692" font-size="12.5" font-weight="600" text-anchor="middle" fill="#712B13">Eval &amp; confidence scorer</text>
  <text x="995" y="708" font-size="10.5" text-anchor="middle" fill="#993C1D">sampled review, drift checks</text>

  <!-- ============ Data layer ============ -->
  <rect x="385" y="700" width="240" height="76" rx="9" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="505" y="726" font-size="13.5" font-weight="600" text-anchor="middle" fill="#085041">PostgreSQL</text>
  <text x="505" y="744" font-size="11" text-anchor="middle" fill="#0F6E56">multi-tenant, row-level security</text>
  <text x="505" y="761" font-size="11" text-anchor="middle" fill="#0F6E56">brand_id on every table</text>

  <rect x="635" y="590" width="220" height="76" rx="9" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="745" y="616" font-size="13.5" font-weight="600" text-anchor="middle" fill="#085041">Qdrant (vector store)</text>
  <text x="745" y="634" font-size="11" text-anchor="middle" fill="#0F6E56">one namespace / collection</text>
  <text x="745" y="651" font-size="11" text-anchor="middle" fill="#0F6E56">per brand</text>

  <rect x="635" y="700" width="220" height="76" rx="9" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="745" y="726" font-size="13.5" font-weight="600" text-anchor="middle" fill="#085041">Redis cache</text>
  <text x="745" y="744" font-size="11" text-anchor="middle" fill="#0F6E56">hot KB entries, session state,</text>
  <text x="745" y="761" font-size="11" text-anchor="middle" fill="#0F6E56">rate-limit counters</text>

  <line x1="625" y1="738" x2="633" y2="738" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ============ Background jobs / reliability (right column) ============ -->
  <rect x="1145" y="284" width="270" height="480" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1"/>
  <text x="1280" y="310" font-size="14" font-weight="600" text-anchor="middle" fill="#27500A">Background jobs &amp; reliability</text>

  <rect x="1165" y="326" width="230" height="64" rx="6" fill="#FFFFFF" stroke="#639922" stroke-width="0.75"/>
  <text x="1280" y="350" font-size="12" font-weight="600" text-anchor="middle" fill="#27500A">Retry worker</text>
  <text x="1280" y="367" font-size="10.5" text-anchor="middle" fill="#3B6D11">exponential backoff on</text>
  <text x="1280" y="381" font-size="10.5" text-anchor="middle" fill="#3B6D11">timeouts / AI failures</text>

  <rect x="1165" y="402" width="230" height="64" rx="6" fill="#FFFFFF" stroke="#639922" stroke-width="0.75"/>
  <text x="1280" y="426" font-size="12" font-weight="600" text-anchor="middle" fill="#27500A">Dead-letter queue</text>
  <text x="1280" y="443" font-size="10.5" text-anchor="middle" fill="#3B6D11">exhausted-retry messages,</text>
  <text x="1280" y="457" font-size="10.5" text-anchor="middle" fill="#3B6D11">paged for manual triage</text>

  <rect x="1165" y="478" width="230" height="64" rx="6" fill="#FFFFFF" stroke="#639922" stroke-width="0.75"/>
  <text x="1280" y="502" font-size="12" font-weight="600" text-anchor="middle" fill="#27500A">Delivery confirmer</text>
  <text x="1280" y="519" font-size="10.5" text-anchor="middle" fill="#3B6D11">channel webhook receipts,</text>
  <text x="1280" y="533" font-size="10.5" text-anchor="middle" fill="#3B6D11">flags unsent approved replies</text>

  <rect x="1165" y="554" width="230" height="64" rx="6" fill="#FFFFFF" stroke="#639922" stroke-width="0.75"/>
  <text x="1280" y="578" font-size="12" font-weight="600" text-anchor="middle" fill="#27500A">Cost &amp; usage monitor</text>
  <text x="1280" y="595" font-size="10.5" text-anchor="middle" fill="#3B6D11">tokens/brand, alerts on</text>
  <text x="1280" y="609" font-size="10.5" text-anchor="middle" fill="#3B6D11">anomalous spend</text>

  <rect x="1165" y="630" width="230" height="64" rx="6" fill="#FFFFFF" stroke="#639922" stroke-width="0.75"/>
  <text x="1280" y="654" font-size="12" font-weight="600" text-anchor="middle" fill="#27500A">Observability</text>
  <text x="1280" y="671" font-size="10.5" text-anchor="middle" fill="#3B6D11">structured logs, traces,</text>
  <text x="1280" y="685" font-size="10.5" text-anchor="middle" fill="#3B6D11">per-brand dashboards</text>

  <line x1="985" y1="316" x2="1140" y2="316" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow-dash)"/>
  <line x1="1145" y1="600" x2="1100" y2="699" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow-dash)"/>

  <!-- ============ Legend ============ -->
  <g transform="translate(40,822)">
    <rect x="0" y="0" width="1380" height="110" rx="8" fill="#F7F5F1" stroke="#d7e0dc" stroke-width="1"/>
    <text x="16" y="22" font-size="12" font-weight="600" fill="#172420">Legend</text>
    <rect x="16" y="34" width="16" height="16" rx="3" fill="#E6F1FB" stroke="#378ADD"/>
    <text x="38" y="46" font-size="11" fill="#172420">Channel / edge</text>
    <rect x="170" y="34" width="16" height="16" rx="3" fill="#F1EFE8" stroke="#888780"/>
    <text x="192" y="46" font-size="11" fill="#172420">Gateway / ingestion</text>
    <rect x="350" y="34" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#7F77DD"/>
    <text x="372" y="46" font-size="11" fill="#172420">Core service</text>
    <rect x="490" y="34" width="16" height="16" rx="3" fill="#FAECE7" stroke="#D85A30"/>
    <text x="512" y="46" font-size="11" fill="#172420">AI layer</text>
    <rect x="590" y="34" width="16" height="16" rx="3" fill="#E1F5EE" stroke="#1D9E75"/>
    <text x="612" y="46" font-size="11" fill="#172420">Data store</text>
    <rect x="700" y="34" width="16" height="16" rx="3" fill="#EAF3DE" stroke="#639922"/>
    <text x="722" y="46" font-size="11" fill="#172420">Background job / reliability</text>
    <rect x="940" y="34" width="16" height="16" rx="3" fill="#FBEAF0" stroke="#D4537E"/>
    <text x="962" y="46" font-size="11" fill="#172420">Frontend</text>
    <line x1="16" y1="76" x2="46" y2="76" stroke="#5f5e5a" stroke-width="1.25" marker-end="url(#arrow)"/>
    <text x="54" y="80" font-size="11" fill="#172420">Synchronous / primary data flow</text>
    <line x1="330" y1="76" x2="360" y2="76" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow-dash)"/>
    <text x="368" y="80" font-size="11" fill="#172420">Async / monitoring signal</text>
  </g>
</svg>
